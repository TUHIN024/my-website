<!DOCTYPE html>

<head>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}

body{
background:linear-gradient(-45deg,#00c6ff,#0072ff,#8e2de2,#ff0080);
background-size:400% 400%;
animation:bg 12s ease infinite;
color:white;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

section{
padding:70px 10%;
text-align:center;
}

.profile{
width:180px;
height:180px;
margin:auto;
border-radius:50%;
border:6px solid white;
display:flex;
justify-content:center;
align-items:center;
font-size:70px;
font-weight:bold;
background:rgba(255,255,255,.15);
backdrop-filter:blur(12px);
box-shadow:0 0 30px rgba(255,255,255,.4);
}

h1{
font-size:55px;
margin-top:20px;
}

#typing{
font-size:28px;
color:#ffe600;
height:40px;
margin:20px 0;
}

.about{
max-width:800px;
margin:auto;
font-size:18px;
line-height:1.8;
}

.skills{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:20px;
margin-top:40px;
}

.skill{
background:rgba(255,255,255,.15);
padding:15px 30px;
border-radius:40px;
font-weight:bold;
transition:.3s;
}

.skill:hover{
transform:scale(1.1);
background:white;
color:#333;
}

.buttons{
margin-top:40px;
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:20px;
}

.buttons a{
text-decoration:none;
padding:15px 30px;
border-radius:50px;
font-size:18px;
font-weight:bold;
color:white;
transition:.3s;
}

.fb{background:#1877F2;}
.wa{background:#25D366;}
.mail{background:#ff4444;}

.buttons a:hover{
transform:translateY(-5px);
}

footer{
padding:25px;
text-align:center;
background:rgba(0,0,0,.2);
margin-top:60px;
}
</style>
</head>

<body>

<section>

<div class="profile">T</div>

<h1>Md. Tuhin Khan</h1>

<div id="typing"></div>

<p class="about">
Hello! 👋<br><br>

Student of Cantonment College Jashore | Learning Web Design & Graphic Design.<br>
Welcome to my personal portfolio website.
</p>

<div class="skill">HTML</div>
<div class="skill">CSS</div>

<div class="skill">Photoshop</div>

</div>

<a class="mail" href="mailto:acer41365@gmail.com">📧 Email</a>

</div>

</section>

<footer>

© 2026 Md. Tuhin Khan | All Rights Reserved

</footer>

<script>

const text="HSC Science Student • Web Learner • Graphic Designer";

let i=0;

function typing(){

if(i<text.length){

document.getElementById("typing").innerHTML+=text.charAt(i);

i++;

setTimeout(typing,80);

}

}

typing();

</script>
