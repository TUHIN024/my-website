<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Md. Tuhin Khan</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(-45deg,#ff4e50,#f9d423,#24c6dc,#5433ff);
    background-size:400% 400%;
    animation:bg 10s ease infinite;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.card{
    width:420px;
    padding:40px;
    text-align:center;
    background:rgba(255,255,255,0.15);
    border-radius:20px;
    backdrop-filter:blur(12px);
    box-shadow:0 10px 35px rgba(0,0,0,.3);
}

.profile{
    width:130px;
    height:130px;
    border-radius:50%;
    background:linear-gradient(45deg,#00f2fe,#4facfe,#43e97b,#f9d423);
    display:flex;
    justify-content:center;
    align-items:center;
    margin:auto;
    font-size:55px;
    color:white;
    font-weight:bold;
    border:4px solid white;
}

h1{
    margin-top:20px;
    color:white;
    font-size:35px;
}

h2{
    color:#fff;
    margin-top:10px;
    font-weight:normal;
}

p{
    color:white;
    margin-top:20px;
    line-height:1.7;
}

button{
    margin-top:25px;
    padding:12px 28px;
    border:none;
    border-radius:30px;
    background:#ffffff;
    color:#333;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
    background:#00e5ff;
    color:white;
}

footer{
    margin-top:25px;
    color:white;
    font-size:14px;
}
</style>

</head>
<body>

<div class="card">

<div class="profile">
T
</div>
